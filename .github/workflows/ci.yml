name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Security scan
        run: node scripts/security-check.mjs

      - name: Verify
        run: npm run verify

      - name: Build output is clean
        run: |
          if find dist -name '*.test.*' | grep -q .; then
            echo "::error::test artifacts found in dist"
            find dist -name '*.test.*' -print
            exit 1
          fi
